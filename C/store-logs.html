<body>
<header class="app-header" data-title="全好蔬果｜店家操作紀錄" data-user-id="topLoginName" data-logout-id="logout"></header>
<script src="assets/header.js"></script>
<main>
 <div class="heading page-heading"><div><h1 class="page-heading__title">店家操作紀錄</h1><p class="page-heading__description">查看店家資料及店家聯絡人帳號相關的操作稽核紀錄。</p></div><div class="heading-actions"><a class="btn" href="stores.html">返回店家管理</a><button class="primary" id="refresh">重新整理</button></div></div>
 <div class="message" id="message" role="status" aria-live="polite"></div>
 <section class="panel"><h2>操作紀錄列表</h2>
  <div class="filters">
   <div class="filter"><label for="search">關鍵字搜尋</label><input class="field" id="search" type="search" placeholder="搜尋操作人、店家、操作內容或紀錄 ID"></div>
   <div class="filter"><label for="fromDate">開始日期</label><input class="field" id="fromDate" type="date"></div>
   <div class="filter"><label for="toDate">結束日期</label><input class="field" id="toDate" type="date"></div>
   <button id="clear">清除條件</button>
  </div>
  <div class="summary"><span id="count">載入中…</span><span>依操作時間由新到舊</span></div>
  <div class="tablewrap"><table><thead><tr><th>操作時間</th><th>操作人員</th><th>操作項目</th><th>店家／對象</th><th>操作內容</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">正在讀取操作紀錄…</td></tr></tbody></table></div>
  <div class="pagination"><span id="pageInfo"></span><button id="prev">上一頁</button><button id="next">下一頁</button></div>
  <div class="note">此頁讀取 Supabase 的 <b>audit_logs</b> 稽核資料，僅呈現與店家或店家聯絡人相關的紀錄。若列表沒有資料，可能代表目前尚未有相關稽核紀錄，或現有店家管理頁的新增／修改／停用操作尚未寫入 audit_logs；不會自行補造歷史紀錄。</div>
 </section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://aiojcpfahyooveqthhwy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_SW-Ji-Co-5cUBe1b5K0Grw_lm9WO8Je";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);let allRows=[],page=1;const pageSize=30;
const STORE_TABLES=new Set(['stores','store_accounts','customer_store_accounts','store_contacts','customer_contacts','customer_accounts']);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showMessage(t,error=false){$('message').textContent=t;$('message').className='message show'+(error?' error':'')}
function getDetails(row){return row.details&&typeof row.details==='object'?row.details:{}}
function isStoreLog(row){const table=String(row.table_name||'').toLowerCase();const action=String(row.action||'').toLowerCase();const d=getDetails(row);const summary=String(d.summary||'').toLowerCase();return STORE_TABLES.has(table)||table.includes('store')||table.includes('customer')||action.includes('store')||action.includes('customer')||summary.includes('店家')||summary.includes('聯絡人')}
function dateText(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('zh-TW',{hour12:false})}
function actionText(v){const map={store_created:'建立店家',store_updated:'修改店家',store_enabled:'啟用店家',store_disabled:'停用店家',store_deleted:'刪除店家',customer_contact_created:'新增店家聯絡人',customer_contact_updated:'修改店家聯絡人',customer_contact_enabled:'啟用店家聯絡人',customer_contact_disabled:'停用店家聯絡人',customer_contact_permanently_deleted:'永久刪除店家聯絡人'};return map[v]||v||'未提供'}
function rowTarget(row){const d=getDetails(row);return d.store_name||d.customer_store_name||d.contact_name||d.deleted_contact_name||d.employee_name||d.summary||row.record_id||'—'}
function rowSummary(row){const d=getDetails(row);return d.summary||d.description||d.note||Object.entries(d).filter(([k])=>!['summary','store_name','contact_name','email','phone'].includes(k)).map(([k,v])=>`${k}：${typeof v==='object'?JSON.stringify(v):v}`).join('\n')||'—'}
function filtered(){const q=$('search').value.trim().toLowerCase(),from=$('fromDate').value,to=$('toDate').value;return allRows.filter(r=>{const d=getDetails(r);const hay=[r.action,r.table_name,r.record_id,r.user_name,d.summary,d.store_name,d.customer_store_name,d.contact_name,d.deleted_contact_name,d.employee_name,d.email,d.phone].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;const stamp=new Date(r.created_at||0);if(from&&stamp<new Date(from+'T00:00:00'))return false;if(to&&stamp>new Date(to+'T23:59:59'))return false;return true})}
function render(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages);const start=(page-1)*pageSize,shown=rows.slice(start,start+pageSize);$('count').textContent=`共 ${rows.length} 筆相關紀錄`;$('pageInfo').textContent=`第 ${page} / ${pages} 頁`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;if(!shown.length){$('rows').innerHTML='<tr><td colspan="5" class="empty">目前沒有符合條件的店家操作紀錄</td></tr>';return}$('rows').innerHTML=shown.map(r=>{const d=getDetails(r);const operator=r.operator_name||r.user_name||r.profiles?.display_name||r.user_id||'未知';return `<tr><td>${esc(dateText(r.created_at))}</td><td>${esc(operator)}</td><td><span class="tag">${esc(actionText(r.action))}</span><div class="sub">${esc(r.table_name||'')}</div></td><td>${esc(rowTarget(r))}<div class="sub">${esc(r.record_id||'')}</div></td><td><div class="detail">${esc(rowSummary(r))}</div></td></tr>`}).join('')}
async function load(){ $('rows').innerHTML='<tr><td colspan="5" class="empty">正在讀取操作紀錄…</td></tr>';try{const {data,error}=await db.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(1500);if(error)throw error;const logs=(data||[]).filter(isStoreLog);const ids=[...new Set(logs.map(x=>x.user_id).filter(Boolean))];let names={};if(ids.length){const {data:profiles,error:profileError}=await db.from('profiles').select('id,display_name').in('id',ids);if(!profileError)(profiles||[]).forEach(p=>names[p.id]=p.display_name)}allRows=logs.map(x=>({...x,operator_name:names[x.user_id]||''}));page=1;render();}catch(e){$('rows').innerHTML='<tr><td colspan="5" class="empty">無法讀取操作紀錄</td></tr>';showMessage('讀取店家操作紀錄失敗：'+(e.message||'未知錯誤'),true)}}
async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.replace('index.html');return}const {data:p,error}=await db.from('profiles').select('role,display_name,is_active,deleted_at').eq('id',session.user.id).single();if(error||p?.role!=='admin'||p.is_active===false||p.deleted_at){alert('此功能僅限有效的管理者帳號使用。');location.replace('index.html');return}$('topLoginName').textContent=p.display_name||session.user.email||'管理者';await load()}
$('refresh').onclick=load;$('search').addEventListener('input',()=>{page=1;render()});$('fromDate').onchange=()=>{page=1;render()};$('toDate').onchange=()=>{page=1;render()};$('clear').onclick=()=>{$('search').value='';$('fromDate').value='';$('toDate').value='';page=1;render()};$('prev').onclick=()=>{if(page>1){page--;render()}};$('next').onclick=()=>{page++;render()};$('logout').onclick=async()=>{await db.auth.signOut();location.replace('index.html')};init();
</script></body></html>
