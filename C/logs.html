<script>
(()=>{
 const SUPABASE_URL='https://aiojcpfahyooveqthhwy.supabase.co';
 const SUPABASE_PUBLISHABLE_KEY='sb_publishable_SW-Ji-Co-5cUBe1b5K0Grw_lm9WO8Je';
 const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
 const $=id=>document.getElementById(id); let allRows=[],shown=0; const PAGE=50;
 const actionNames={quotation_created:'新增報價單',quotation_updated:'修改報價單',quotation_deleted:'刪除報價單（移至回收區）',quotation_restored:'復原報價單',quotation_permanently_deleted:'永久刪除報價單',employee_created:'新增員工',employee_updated:'修改員工資料',employee_disabled:'停用員工',employee_enabled:'啟用員工',employee_deleted:'刪除員工',employee_restored:'復原員工',customer_contact_created:'新增店家聯絡人',customer_contact_disabled:'停用店家聯絡人',customer_contact_enabled:'啟用店家聯絡人',customer_contact_permanently_deleted:'永久刪除店家聯絡人',store_permanently_deleted:'永久刪除店家'};
 const categoryNames={quotations:'報價單',stores:'店家',customer_contacts:'店家聯絡人',employee_accounts:'員工帳號'};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmtTime=s=>new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(s));
 function objectLabel(d){return d.quotation_no||d.employee_name||d.store_name||d.contact_name||d.email||d.employee_email||'—'}
 function detailsText(d){const clean={...d}; delete clean.prepared; return Object.entries(clean).map(([k,v])=>`${k}: ${typeof v==='object'?JSON.stringify(v):String(v??'')}`).join('\n')||'沒有額外詳細資料';}
 function fillActionOptions(){const cat=$('category').value;const acts=[...new Set(allRows.filter(r=>!cat||r.table_name===cat).map(r=>r.action))].sort();$('actionFilter').innerHTML='<option value="">全部操作</option>'+acts.map(a=>`<option value="${esc(a)}">${esc(actionNames[a]||a)}</option>`).join('');}
 function filtered(){const q=$('search').value.trim().toLocaleLowerCase();const cat=$('category').value,act=$('actionFilter').value;return allRows.filter(r=>{if(cat&&r.table_name!==cat)return false;if(act&&r.action!==act)return false;if(!q)return true;return [r.operator_name,r.action,r.table_name,r.record_id,JSON.stringify(r.details||{})].join(' ').toLocaleLowerCase().includes(q)});}
 function render(reset=true){const data=filtered();if(reset)shown=0;const next=data.slice(shown,shown+PAGE);shown+=next.length;$('count').textContent=`共 ${data.length} 筆符合條件${allRows.length===200?'（目前最多載入最近 200 筆）':''}`;if(!data.length){$('rows').innerHTML='<tr><td colspan="5" class="empty">沒有符合條件的操作紀錄</td></tr>';}else if(reset){$('rows').innerHTML='';}const frag=document.createDocumentFragment();next.forEach(r=>{const tr=document.createElement('tr');const d=r.details||{};tr.innerHTML=`<td class="time">${esc(fmtTime(r.created_at))}</td><td class="actor">${esc(r.operator_name||'無法辨識')}</td><td><span class="category">${esc(categoryNames[r.table_name]||r.table_name||'其他')}</span></td><td class="action">${esc(actionNames[r.action]||r.action)}</td><td><div>${esc(objectLabel(d))}</div><button class="detail-btn" type="button">查看詳細內容⌄</button><div class="details" hidden>${esc(detailsText(d))}</div></td>`;const b=tr.querySelector('.detail-btn'),box=tr.querySelector('.details');b.addEventListener('click',()=>{box.hidden=!box.hidden;b.textContent=box.hidden?'查看詳細內容⌄':'收合詳細內容⌃'});frag.appendChild(tr);});$('rows').appendChild(frag);$('more').hidden=shown>=data.length;}
 async function init(){const {data:{session}}=await db.auth.getSession();if(!session){deny('登入狀態已失效，請重新登入。');return;}const {data:profile,error}=await db.from('profiles').select('role,display_name,is_active,deleted_at').eq('id',session.user.id).maybeSingle();if(error||!profile||profile.role!=='admin'||profile.is_active===false||profile.deleted_at){deny('此頁面僅限有效的管理者帳號使用。');return;}$('userName').textContent=profile.display_name||session.user.email||'管理者';$('main').hidden=false;await load();}
 function deny(msg){$('blockedText').textContent=msg;$('blocked').hidden=false;$('main').hidden=true;}
 async function load(){ $('rows').innerHTML='<tr><td colspan="5" class="status">正在讀取操作紀錄…</td></tr>';$('count').textContent='讀取中…';const {data,error}=await db.from('audit_logs').select('id,user_id,action,table_name,record_id,details,created_at').order('created_at',{ascending:false}).limit(200);if(error){$('rows').innerHTML=`<tr><td colspan="5" class="status error">讀取失敗：${esc(error.message)}</td></tr>`;$('count').textContent='無法讀取資料';return;}const ids=[...new Set((data||[]).map(x=>x.user_id).filter(Boolean))];let names={};if(ids.length){const {data:profiles}=await db.from('profiles').select('id,display_name').in('id',ids);(profiles||[]).forEach(x=>names[x.id]=x.display_name);}allRows=(data||[]).map(r=>({...r,operator_name:names[r.user_id]||null}));fillActionOptions();render();}
 $('search').addEventListener('input',()=>render());$('category').addEventListener('change',()=>{fillActionOptions();render();});$('actionFilter').addEventListener('change',()=>render());$('reset').addEventListener('click',()=>{$('search').value='';$('category').value='';fillActionOptions();$('actionFilter').value='';render();});$('more').addEventListener('click',()=>render(false));$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.href='index.html';});db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.href='index.html';});init().catch(e=>deny('初始化失敗：'+e.message));
})();
</script></body></html>
