<script>
/* 全站統一 Loading：初始載入、頁面切換、資料讀取、儲存與刪除 */
(function(){
  const overlay = document.getElementById('globalBusyOverlay') || document.getElementById('busyOverlay');
  if (!overlay || window.__globalBusyControllerInstalled) return;
  window.__globalBusyControllerInstalled = true;

  const title = overlay.querySelector('.global-busy-title') || overlay.querySelector('#busyTitle');
  const detail = overlay.querySelector('.global-busy-text') || overlay.querySelector('#busyText');
  let active = 0, pendingInitial = 0, pageLoaded = false, showTimer = null, hideTimer = null;
  let currentKind = 'load';

  function setText(kind){
    currentKind = kind;
    if(title){
      title.classList.toggle('busy-dots', kind === 'save' || kind === 'load' || kind === 'delete');
      title.textContent = ({
        load:'資料載入中', save:'儲存中', delete:'刪除中'
      })[kind] || '資料處理中';
    }
    if(detail){
      detail.textContent = ({
        load:'正在讀取資料，請稍候…',
        save:'正在儲存資料，請稍候，請勿重複操作。',
        delete:'正在安全刪除資料，請稍候，請勿重複操作。',
        switch:'正在準備頁面內容，請稍候…'
      })[kind] || '系統正在處理資料，請稍候…';
    }
  }
  function show(kind){
    if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}
    setText(kind);
    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden','false');
  }
  function hide(){
    if(active > 0 || !pageLoaded) return;
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden','true');
  }

  // 不因頁面初始載入或頁面切換顯示全頁遮罩；僅在實際資料請求時顯示。
  window.addEventListener('load', function(){
    pageLoaded = true;
    if(active === 0) setTimeout(hide, 180);
  }, {once:true});
const nativeFetch = window.fetch.bind(window);
  window.fetch = function(input, init){
    const raw = typeof input === 'string' ? input : (input && input.url) || '';
    const tracked = !window.__suppressGlobalBusy &&
      (/supabase\.co|workers\.dev/i.test(raw));
    if(!tracked) return nativeFetch(input, init);

    const method = String((init && init.method) || (input && input.method) || 'GET').toUpperCase();
    const destructive = method === 'DELETE' || /delete|remove|hard-delete/i.test(raw);
    const writing = ['POST','PUT','PATCH'].includes(method);
    const kind = destructive ? 'delete' : writing ? 'save' : 'load';

    active++;
    pendingInitial++;
    if(showTimer) clearTimeout(showTimer);
    if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}
    // 顯示延遲避免極短請求造成閃爍；頁面初始 Loading 已經顯示
    showTimer = setTimeout(()=>show(kind), 100);

    let request;
    try{request = nativeFetch(input, init);}
    catch(error){finish();throw error;}
    return request.finally(finish);
  };

  function finish(){
    active = Math.max(0, active - 1);
    pendingInitial = Math.max(0, pendingInitial - 1);
    if(active === 0){
      if(showTimer){clearTimeout(showTimer);showTimer=null;}
      hideTimer = setTimeout(hide, 220);
    }
  }

  // 提供頁面程式可共用的手動控制介面
  window.showGlobalLoading = function(kind='load'){show(kind);};
  window.hideGlobalLoading = function(){if(active===0){pageLoaded=true;hide();}};
})();

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL = "https://aiojcpfahyooveqthhwy.supabase.co";
const SUPABASE_KEY = "sb_publishable_SW-Ji-Co-5cUBe1b5K0Grw_lm9WO8Je";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const rows=document.getElementById("logRows"),msg=document.getElementById("message");let names={};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function say(t,e=false){msg.textContent=t;msg.className="message show"+(e?" error":"");}
function dt(v){return v?new Date(v).toLocaleString("zh-TW",{hour12:false,timeZone:"Asia/Taipei"}):"—";}
const labels={employee_created:"建立員工",employee_updated:"修改員工",employee_disabled:"停用員工",employee_enabled:"啟用員工",employee_deleted:"軟刪除員工",employee_restored:"復原員工"};
async function init() {
  try {
    say("正在確認登入狀態……");

    const { data, error } = await sb.auth.getSession();

    if (error) {
      console.error("Session 查詢錯誤：", error);
      say("Session 查詢失敗：" + error.message, true);
      return;
    }

    if (!data.session) {
      say("目前沒有有效的登入 Session，請重新登入。", true);
      return;
    }

    say("登入正常，正在確認管理者權限……");

    const { data: p, error: pe } = await sb
      .from("profiles")
      .select("id,role,display_name,is_active,deleted_at")
      .eq("id", data.session.user.id)
      .single();

    if (pe) {
      console.error("管理者資料查詢錯誤：", pe);
      say("管理者資料查詢失敗：" + pe.message, true);
      return;
    }

    if (!p) {
      say("找不到目前登入者的 profiles 資料。", true);
      return;
    }

    if (
      p.role !== "admin" ||
      p.is_active !== true ||
      p.deleted_at !== null
    ) {
      console.error("管理者權限不符合：", p);
      say("目前帳號不符合管理者權限條件。", true);
      return;
    }

    const loginName = p.display_name || data.session.user.email || "管理者";
    const loginNameEl = document.getElementById("topLoginName");
    if (loginNameEl) { loginNameEl.textContent = loginName; loginNameEl.title = loginName; }

    say("管理者驗證成功，正在讀取員工資料……");

    const { data: ps, error: psErr } = await sb
      .from("profiles")
      .select("id,display_name")
      .limit(1000);

    if (psErr) {
      console.error("員工姓名查詢錯誤：", psErr);
      say("無法讀取姓名資料：" + psErr.message, true);
      return;
    }

    names = Object.fromEntries(
      (ps || []).map(x => [
        x.id,
        x.display_name || "（未設定姓名）"
      ])
    );

    say("管理者驗證完成，正在讀取操作紀錄……");

    await load();

  } catch (error) {
    console.error("員工操作紀錄初始化錯誤：", error);
    say("初始化發生錯誤：" + error.message, true);
  }
}
async function load(){rows.innerHTML='<tr><td colspan="6" class="empty">載入中…</td></tr>';let q=sb.from("audit_logs").select("id,user_id,action,table_name,record_id,details,created_at").eq("table_name","employee_accounts").order("created_at",{ascending:false}).limit(200);
const f=document.getElementById("fromDate").value,t=document.getElementById("toDate").value,a=document.getElementById("actionFilter").value;if(f)q=q.gte("created_at",new Date(f+"T00:00:00+08:00").toISOString());if(t)q=q.lte("created_at",new Date(t+"T23:59:59+08:00").toISOString());if(a)q=q.eq("action",a);
const {data,error}=await q;if(error){rows.innerHTML='<tr><td colspan="6" class="empty">讀取失敗</td></tr>';say("讀取操作紀錄失敗："+error.message,true);return;}
if(!data?.length){rows.innerHTML='<tr><td colspan="6" class="empty">目前沒有員工操作紀錄。完成 Worker 稽核寫入功能部署後，新操作才會出現在這裡。</td></tr>';return;}
rows.innerHTML=data.map(x=>{const d=x.details||{};return `<tr><td>${esc(dt(x.created_at))}</td><td>${esc(names[x.user_id]||"管理者")}</td><td>${esc(d.employee_name||d.display_name||names[x.record_id]||"（員工資料不可用）")}</td><td><span class="pill">${esc(labels[x.action]||x.action||"—")}</span></td><td>${esc(d.summary||d.message||d.email||"—")}</td><td>${esc(x.id)}</td></tr>`;}).join("");}
document.getElementById("refreshBtn").onclick=load;document.getElementById("filterBtn").onclick=load;document.getElementById("logoutBtn").onclick=async()=>{await sb.auth.signOut();location.replace("index.html");};init();
</script></body></html>
