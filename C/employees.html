
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全好蔬果｜員工管理</title>

<style>
:root {
  --green: #173f2d;
  --green2: #24543d;
  --ink: #203329;
  --muted: #718078;
  --line: #e3e9e3;
  --bg: #f4f6f1;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Noto Sans TC",
    "Microsoft JhengHei", sans-serif;
}

header {
  position: sticky;
  top: 0;
  z-index: 1000;
  height: 84px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 max(22px, calc((100% - 1120px)/2));
}

.brand {
  font-weight: 800; color: var(--green); letter-spacing: 1px;
  display:flex;align-items:center;gap:14px;text-decoration:none;
}
.brand img{width:62px;height:62px;object-fit:contain;border-radius:12px;}

.top-actions {
  display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px;
}
.top-login-name{font-weight:700;color:var(--green);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

button, a.btn {
  border: 0;
  border-radius: 9px;
  padding: 10px 15px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed !important;
}

/* 新增員工：Deploy 式按鈕 Loading，不使用中央遮罩 */
button.is-loading {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  overflow: hidden; padding-bottom: 13px; cursor: not-allowed !important;
}
button.is-loading::before {
  content: ""; width: 14px; height: 14px; flex: 0 0 14px; border: 2px solid rgba(255,255,255,.38);
  border-top-color: #fff; border-radius: 50%; animation: button-loading-spin .75s linear infinite;
}
button.is-loading::after {
  content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 38%;
  border-radius: 99px; background: linear-gradient(90deg,#8fc5a0,#fff,#8fc5a0);
  animation: button-loading-progress 1.15s ease-in-out infinite;
}
@keyframes button-loading-spin { to { transform: rotate(360deg); } }
@keyframes button-loading-progress { 0% { transform: translateX(-110%); } 100% { transform: translateX(290%); } }
@media(prefers-reduced-motion:reduce) { button.is-loading::before,button.is-loading::after { animation:none; } button.is-loading::after { width:100%; transform:none; } }

.primary {
  background: var(--green);
  color: white;
}

.secondary {
  background: #edf3ed;
  color: var(--green);
}

.danger {
  background: #fff0ed;
  color: #9b392b;
}

.plain {
  background: #fff;
  border: 1px solid var(--line);
  color: var(--green);
}

main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 36px 22px;
}

.heading {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 15px;
  margin-bottom: 22px;
}

.heading h1 {
  margin: 0 0 7px;
  color: var(--green);
  font-size: 28px;
}

.heading p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

.heading-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.panel {
  background: white;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 6px 20px #1b392408;
}

.panel h2 {
  font-size: 18px;
  margin: 0 0 18px;
  color: var(--green);
}

.message {
  display: none;
  padding: 12px 14px;
  border-radius: 9px;
  background: #edf3ed;
  color: #31523c;
  font-size: 13px;
  white-space: pre-wrap;
  margin: 0 0 16px;
}

.message.show {
  display: block;
}

.message.error {
  background: #fff0ed;
  color: #9b392b;
}

/* 全站通知置頂：高於頁首、對話框、遮罩及處理中視窗，避免成功/失敗訊息被遮住 */
.message.show,
.notice.show {
  position: fixed !important;
  top: 98px !important;
  left: 50% !important;
  right: auto !important;
  bottom: auto !important;
  transform: translateX(-50%);
  z-index: 20000 !important;
  display: block !important;
  width: min(760px, calc(100vw - 32px));
  max-width: calc(100vw - 32px);
  max-height: min(30vh, 180px);
  overflow-y: auto;
  margin: 0 !important;
  padding: 13px 16px;
  border-radius: 11px;
  box-shadow: 0 8px 28px rgba(15, 35, 24, .22);
  border: 1px solid rgba(23, 63, 45, .14);
  line-height: 1.6;
  pointer-events: auto;
}
.message.show { border-left: 5px solid #2e7d46; }
.message.show.error { border-left-color: #c62828; }
.notice.show { border-left: 5px solid #2e7d46; }
.notice.show.error { border-left-color: #c62828; }
@media (max-width: 650px) {
  .message.show,
  .notice.show {
    top: 92px !important;
    width: calc(100vw - 24px);
    max-width: calc(100vw - 24px);
    max-height: 34vh;
    padding: 12px 13px;
    font-size: 13px;
  }
}



.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 850px;
}

th, td {
  text-align: left;
  padding: 13px 10px;
  border-bottom: 1px solid #edf0ec;
  font-size: 13px;
  vertical-align: middle;
}

th {
  color: #65756a;
  font-weight: 700;
  background: #fafbf9;
}

td strong {
  color: #263d2e;
}

.status {
  display: inline-block;
  border-radius: 20px;
  padding: 5px 9px;
  font-size: 11px;
  font-weight: 700;
  background: #eaf3eb;
  color: #28613c;
}

.status.off {
  background: #fff3e3;
  color: #94621f;
}

.status.deleted {
  background: #fcebea;
  color: #a13d35;
}

.actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.actions button {
  padding: 7px 9px;
  font-size: 11px;
}

.empty {
  text-align: center;
  color: #849087;
  padding: 30px;
}

.small {
  font-size: 12px;
  color: var(--muted);
  margin-top: 10px;
}

/* 建立員工彈出視窗 */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  /* 與店家建立視窗一致的深綠灰色背景遮罩 */
  background: #10241888;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal.show {
  display: flex;
}

.modal-content {
  width: min(560px, 100%);
  background: white;
  border-radius: 16px;
  padding: 25px;
  box-shadow: 0 15px 50px #0002;
  animation: modalShow .2s ease;
}

@keyframes modalShow {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.modal-header h2 {
  margin: 0;
  color: var(--green);
  font-size: 20px;
}

.modal-header button {
  background: #f2f4f1;
  color: var(--ink);
  padding: 8px 12px;
}

.modal-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.modal-grid label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: #425448;
  margin-bottom: 7px;
}

.modal-grid input {
  width: 100%;
  height: 43px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0 11px;
  font: inherit;
}

.modal-grid input:focus {
  outline: 2px solid #c6d8c9;
  border-color: var(--green);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 22px;
}

@media(max-width: 760px) {
  .heading {
    align-items: start;
    flex-direction: column;
  }

  header {
    padding: 0 15px;
  }

  main {
    padding: 24px 14px;
  }
}

@media(max-width: 600px) {
  .modal-grid {
    grid-template-columns: 1fr;
  }

  .heading-actions {
    width: 100%;
  }
}

@media(max-width: 440px) {
  .heading-actions button,
  .heading-actions a {
    flex: 1;
    text-align: center;
  }

  .modal-content {
    padding: 20px;
  }
}

/* 全站一致的返回首頁圖示 */
.home-icon{width:16px;height:16px;display:inline-block;vertical-align:-3px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.site-topbar-home,.home-link{display:inline-flex!important;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
/* 全站資料處理遮罩與動態進度條 */
.global-busy-overlay{display:none;position:fixed;inset:0;z-index:3000;background:rgba(13,29,20,.42);align-items:center;justify-content:center;padding:20px}
.global-busy-overlay.show{display:flex}
.global-busy-card{width:min(100%,390px);background:#fff;border:1px solid #e4e9e4;border-radius:16px;padding:26px 24px;box-shadow:0 18px 60px #0003;text-align:center;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.global-busy-spinner{width:38px;height:38px;margin:0 auto 14px;border:4px solid #e4eee6;border-top-color:#173f2d;border-radius:50%;animation:global-busy-spin .8s linear infinite}
.global-busy-title{font-weight:800;color:#173f2d;font-size:17px;margin-bottom:7px}
.global-busy-text{font-size:13px;color:#718078;margin-bottom:17px}
.global-busy-track{height:7px;background:#e9efe9;border-radius:99px;overflow:hidden}
.global-busy-bar{height:100%;width:38%;background:linear-gradient(90deg,#24543d,#70a77f,#24543d);border-radius:99px;animation:global-busy-run 1.25s ease-in-out infinite}
@keyframes global-busy-spin{to{transform:rotate(360deg)}}
@keyframes global-busy-run{0%{transform:translateX(-115%)}100%{transform:translateX(290%)}}
@media(prefers-reduced-motion:reduce){.global-busy-spinner,.global-busy-bar{animation:none}.global-busy-bar{width:100%;transform:none}}
@media print{.global-busy-overlay{display:none!important}}


.global-busy-title.busy-dots::after{content:'';display:inline-block;width:1.5em;text-align:left;animation:global-busy-dots 1.25s steps(4,end) infinite}
@keyframes global-busy-dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%,100%{content:'...'}}

/* 不顯示自動資料載入遮罩；實際刪除／批次操作時允許手動顯示 */
.global-busy-overlay, #busyOverlay { display:none !important; visibility:hidden !important; pointer-events:none !important; }
.global-busy-overlay.show { display:flex !important; visibility:visible !important; pointer-events:auto !important; z-index:12000; }


/* 員工列表讀取動畫：與店家聯絡人讀取圖示統一 */
.contact-loading{display:flex;align-items:center;justify-content:center;gap:10px;min-height:46px;color:var(--muted);font-weight:600}
.mini-spinner{width:20px;height:20px;border:3px solid #e3ece6;border-top-color:var(--green);border-right-color:var(--green);border-radius:50%;display:inline-block;animation:contactSpin .75s linear infinite}
.loading-dots{display:inline-block;width:1.5em;text-align:left}
.loading-dots::after{content:"";animation:contactDots 1.35s steps(4,end) infinite}
@keyframes contactSpin{to{transform:rotate(360deg)}}
@keyframes contactDots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}


/* 員工管理局部讀取：使用內嵌 SVG，確保圖示穩定顯示 */
.employee-loading{display:flex!important;align-items:center!important;justify-content:center!important;gap:10px!important;min-height:46px;color:#718078;font-weight:600}
.employee-loading-spinner{display:block!important;flex:0 0 22px!important;width:22px!important;height:22px!important;animation:employeeLoadingSpin .8s linear infinite!important;visibility:visible!important;opacity:1!important}
.employee-loading-dots{display:inline-block;width:1.5em;text-align:left}
.employee-loading-dots::after{content:"";animation:employeeLoadingDots 1.35s steps(4,end) infinite}
@keyframes employeeLoadingSpin{to{transform:rotate(360deg)}}
@keyframes employeeLoadingDots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}


/* 管理頁面共用視覺規範：與店家管理頁一致 */
header{
  width:100%;padding:0 max(22px,calc((100% - 1120px)/2));
  height:84px;gap:16px;
}
.brand{font-size:14px;letter-spacing:1px}
main{max-width:1120px;padding:36px 22px}
.heading{margin-bottom:22px;gap:15px}
.heading h1{font-size:28px;line-height:1.3}
.panel{border-radius:15px;padding:22px;box-shadow:0 6px 20px #1b392408}
table{min-width:850px}
th,td{padding:13px 10px;font-size:13px;vertical-align:middle}
th{background:#fafbf9;color:#65756a}
button,a.btn{border-radius:9px}
@media(max-width:650px){
  header{padding:0 14px}
  main{padding:24px 14px}
  .heading{align-items:flex-start;flex-direction:column}
}


/* 員工搜尋與批次工具列：對齊店家管理頁面 */
.employee-toolbar{display:flex;justify-content:flex-end;width:100%;margin-bottom:14px}
.employee-searchbox{position:relative;display:block;width:min(100%,360px)}
.employee-search{width:100%;max-width:none;height:44px;border:1px solid var(--line);border-radius:9px;padding:0 12px 0 42px;font:inherit;font-size:13px;background:#fbfcfa;color:var(--ink)}
.employee-search:focus{outline:none;border-color:#47785b;box-shadow:0 0 0 3px rgba(71,120,91,.12)}
.employee-search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#527b68;pointer-events:none}
.employee-bulkbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:0 0 14px;padding:12px;background:#f8faf7;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--muted)}
.employee-select-all{display:flex;align-items:center;gap:7px;font-weight:700;color:var(--ink)}
.employee-bulkbar input[type=checkbox],.employee-check-cell input{appearance:auto;-webkit-appearance:checkbox;width:20px;height:20px;min-width:20px;accent-color:#174b38;cursor:pointer;vertical-align:middle}
#employeeSelectedCount{margin-right:auto}
.employee-bulk-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.employee-bulk-actions .btn{border:1px solid #dce5dc;background:#fff;color:var(--green);border-radius:9px;padding:10px 15px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2}
.employee-bulk-actions .btn:disabled{opacity:.6;cursor:not-allowed}
.employee-bulk-actions .employee-bulk-delete{color:#a33;border-color:#e7caca}
.employee-bulk-actions .action-icon{flex:0 0 17px}
.employee-check-cell{width:48px;text-align:center!important}
.employee-check-cell input{margin:0}
@media(max-width:600px){.employee-toolbar{justify-content:stretch}.employee-searchbox{width:100%}.employee-bulk-actions{width:100%}.employee-bulk-actions .btn{flex:1}}


/* 員工永久刪除確認視窗：沿用店家管理確認視窗樣式 */
.employee-delete-overlay{position:fixed;inset:0;background:rgba(20,35,27,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}
.employee-delete-overlay.show{display:flex}
.employee-delete-card{width:min(100%,560px);background:#fff;border-radius:18px;padding:30px 32px;box-shadow:0 22px 70px rgba(0,0,0,.24);text-align:center}
.employee-delete-icon{width:58px;height:58px;border-radius:50%;background:#fff2e8;color:#b45309;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;margin:0 auto 16px}
.employee-delete-title{font-size:25px;line-height:1.4;font-weight:850;color:#173f30;margin:0 0 14px}
.employee-delete-message{font-size:17px;line-height:1.9;color:#394b42;white-space:pre-line;margin:0 0 18px}
.employee-delete-name{color:#c62828;font-weight:900}
.employee-delete-input{width:100%;box-sizing:border-box;border:1.5px solid #cbd5ce;border-radius:10px;padding:14px 15px;font-size:18px;text-align:center;outline:none;margin:4px 0 8px}
.employee-delete-input:focus{border-color:#1c5940;box-shadow:0 0 0 3px rgba(28,89,64,.12)}
.employee-delete-hint{font-size:14px;color:#718078;min-height:22px;margin-bottom:18px}
.employee-delete-actions{display:flex;justify-content:center;gap:12px;margin-top:12px}
.employee-delete-actions button{min-width:116px;padding:12px 18px;font-size:16px;border-radius:9px}
.employee-delete-actions .danger{background:#a83232!important;color:#fff!important;border-color:#a83232!important}
.employee-delete-actions button:disabled{opacity:.42;cursor:not-allowed}
@media(max-width:520px){.employee-delete-card{padding:24px 18px}.employee-delete-title{font-size:22px}.employee-delete-message{font-size:16px}.employee-delete-actions{flex-direction:column-reverse}.employee-delete-actions button{width:100%}}


/* 員工列操作按鈕：圖示與店家管理一致，色彩依需求統一 */
.employee-action{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 10px;font-size:12px;line-height:1.2;border:1px solid;border-radius:9px;background:#fff;white-space:nowrap;cursor:pointer}
.employee-action .action-icon{display:inline-block;width:16px;height:16px;vertical-align:-3px;flex:0 0 auto}
.employee-action-edit{color:#174b38;border-color:#d5e3d9;background:#fff}
.employee-action-enable{color:#27613a;border-color:#d5e3d9;background:#e8f3e9}
.employee-action-disable{color:#c62828;border-color:#efcccc;background:#fff1ef}
.employee-action-delete{color:#c62828;border-color:#efcccc;background:#fff1ef}
.employee-action:hover{filter:brightness(.97)}
.employee-action:disabled{opacity:.45;cursor:not-allowed}
.employee-action-edit .action-icon{color:#174b38}
.employee-action-disable .action-icon,.employee-action-delete .action-icon{color:#c62828}
.employee-action-enable .action-icon{color:#27613a}


/* 頁面切換骨架屏：員工管理／店家管理 */
.page-skeleton{position:fixed;inset:0;z-index:10000;background:#f5f8f5;padding:0 0 40px;overflow:auto;opacity:1;visibility:visible;transition:opacity .22s ease,visibility .22s ease}
.page-skeleton.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
.skeleton-top{height:76px;background:#fff;border-bottom:1px solid #e6ece6;display:flex;align-items:center;padding:0 max(24px,calc((100vw - 1180px)/2));gap:14px}
.skeleton-logo{width:48px;height:48px;border-radius:12px}
.skeleton-line,.skeleton-block,.skeleton-pill{position:relative;overflow:hidden;background:#e6ece7;border-radius:8px}
.skeleton-line:after,.skeleton-block:after,.skeleton-pill:after,.skeleton-logo:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);animation:skeleton-shimmer 1.35s ease-in-out infinite}
.skeleton-brand{width:170px;height:17px}
.skeleton-user{width:110px;height:14px;margin-left:auto}
.skeleton-content{width:min(1180px,calc(100% - 48px));margin:38px auto 0}
.skeleton-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}
.skeleton-title{width:190px;height:30px;margin-bottom:10px}
.skeleton-subtitle{width:260px;height:14px}
.skeleton-actions{display:flex;gap:10px}
.skeleton-pill{width:112px;height:40px;border-radius:9px}
.skeleton-panel{background:#fff;border:1px solid #e4ebe4;border-radius:15px;padding:22px;box-shadow:0 6px 20px #1b392408}
.skeleton-panel-title{width:130px;height:20px;margin-bottom:22px}
.skeleton-toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}
.skeleton-search{width:min(340px,48%);height:40px}
.skeleton-small-pill{width:125px;height:36px}
.skeleton-table-head,.skeleton-table-row{display:grid;grid-template-columns:1.1fr 1.5fr 1.2fr .8fr 1fr;gap:18px;align-items:center;padding:15px 10px;border-bottom:1px solid #edf1ed}
.skeleton-table-head{background:#fafbf9}
.skeleton-table-row{height:58px}
.skeleton-cell{height:13px}
.skeleton-cell.short{width:55%}
.skeleton-cell.medium{width:78%}
.skeleton-table-head .skeleton-cell{height:12px}
@keyframes skeleton-shimmer{100%{transform:translateX(100%)}}
@media(max-width:700px){.skeleton-content{width:calc(100% - 28px);margin-top:24px}.skeleton-top{height:64px;padding:0 14px}.skeleton-heading{align-items:flex-start;flex-direction:column}.skeleton-actions{width:100%}.skeleton-pill{flex:1}.skeleton-panel{padding:14px}.skeleton-table-head,.skeleton-table-row{grid-template-columns:1fr 1fr 1fr;gap:10px}.skeleton-table-head .skeleton-cell:nth-child(n+4),.skeleton-table-row .skeleton-cell:nth-child(n+4){display:none}.skeleton-search{width:65%}}

<div class="global-busy-overlay" id="globalBusyOverlay" role="status" aria-live="polite" aria-hidden="true"><section class="global-busy-card"><div class="global-busy-spinner" aria-hidden="true"></div><div class="global-busy-title">正在處理，請稍候…</div><div class="global-busy-text">系統正在讀取或更新資料，請稍候，請勿重複操作。</div><div class="global-busy-track" aria-hidden="true"><div class="global-busy-bar"></div></div></section></div>
<script>
/* 全站統一 Loading：初始載入、頁面切換、資料讀取、儲存與刪除 */
(function(){
  window.__suppressGlobalBusy = true;
  const overlay = document.getElementById('globalBusyOverlay') || document.getElementById('busyOverlay');
  if (!overlay || window.__globalBusyControllerInstalled) return;
  window.__globalBusyControllerInstalled = true;

  const title = overlay.querySelector('.global-busy-title') || overlay.querySelector('#busyTitle');
  const detail = overlay.querySelector('.global-busy-text') || overlay.querySelector('#busyText');
  let active = 0, pendingInitial = 0, pageLoaded = false, showTimer = null, hideTimer = null;
  let currentKind = 'load';

  function setText(kind){
    currentKind = kind;
    if(title){
      title.classList.toggle('busy-dots', kind === 'save' || kind === 'load' || kind === 'delete');
      title.textContent = ({
        load:'資料載入中', save:'儲存中', delete:'刪除中'
      })[kind] || '資料處理中';
    }
    if(detail){
      detail.textContent = ({
        load:'正在讀取資料，請稍候…',
        save:'正在儲存資料，請稍候，請勿重複操作。',
        delete:'正在安全刪除資料，請稍候，請勿重複操作。',
        switch:'正在準備頁面內容，請稍候…'
      })[kind] || '系統正在處理資料，請稍候…';
    }
  }
  function show(kind){
    if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}
    setText(kind);
    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden','false');
  }
  function hide(){
    if(overlay.dataset.manual === '1') return;
    if(active > 0 || !pageLoaded) return;
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden','true');
  }

  // 不因頁面初始載入或頁面切換顯示全頁遮罩；僅在實際資料請求時顯示。
  window.addEventListener('load', function(){
    pageLoaded = true;
    if(active === 0) setTimeout(hide, 180);
  }, {once:true});
const nativeFetch = window.fetch.bind(window);
  window.fetch = function(input, init){
    const raw = typeof input === 'string' ? input : (input && input.url) || '';
    const tracked = !window.__suppressGlobalBusy &&
      (/supabase\.co|workers\.dev/i.test(raw));
    if(!tracked) return nativeFetch(input, init);

    const method = String((init && init.method) || (input && input.method) || 'GET').toUpperCase();
    const destructive = method === 'DELETE' || /delete|remove|hard-delete/i.test(raw);
    const writing = ['POST','PUT','PATCH'].includes(method);
    const kind = destructive ? 'delete' : writing ? 'save' : 'load';

    active++;
    pendingInitial++;
    if(showTimer) clearTimeout(showTimer);
    if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}
    // 顯示延遲避免極短請求造成閃爍；頁面初始 Loading 已經顯示
    showTimer = setTimeout(()=>show(kind), 100);

    let request;
    try{request = nativeFetch(input, init);}
    catch(error){finish();throw error;}
    return request.finally(finish);
  };

  function finish(){
    active = Math.max(0, active - 1);
    pendingInitial = Math.max(0, pendingInitial - 1);
    if(active === 0){
      if(showTimer){clearTimeout(showTimer);showTimer=null;}
      hideTimer = setTimeout(hide, 220);
    }
  }

  // 提供頁面程式可共用的手動控制介面
  window.showGlobalLoading = function(kind='load'){show(kind);};
  window.hideGlobalLoading = function(){if(active===0){pageLoaded=true;hide();}};
})();

</script>

// 防止 HTML 注入

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

// 手機號碼輸入時自動格式化為 09XX-XXX-XXX，送出 API 前轉回純數字
function mobileDigits(value) {
  return String(value ?? "").replace(/\D/g, "").slice(0, 10);
}
function formatMobile(value) {
  const d = mobileDigits(value);
  if (d.length <= 4) return d;
  if (d.length <= 7) return d.slice(0, 4) + "-" + d.slice(4);
  return d.slice(0, 4) + "-" + d.slice(4, 7) + "-" + d.slice(7);
}
function validMobile(value) {
  return /^09\d{8}$/.test(mobileDigits(value));
}
function bindMobileFormat(input) {
  if (!input || input.dataset.mobileFormatBound) return;
  input.dataset.mobileFormatBound = "1";

  input.addEventListener("input", () => {
    const raw = input.value;
    const rawCaret = input.selectionStart ?? raw.length;

    // 計算游標左側已有幾個「數字」，而不是用字串長度計算（連字號不算）
    const digitsBeforeCaret = mobileDigits(raw.slice(0, rawCaret)).length;
    const formatted = formatMobile(raw);

    if (formatted !== raw) {
      input.value = formatted;

      // 將游標放回相同數字之後；若剛好在第 4 或第 7 碼，連字號也算在游標前
      let nextCaret = 0;
      let digitCount = 0;
      while (nextCaret < formatted.length && digitCount < digitsBeforeCaret) {
        if (/\d/.test(formatted[nextCaret])) digitCount++;
        nextCaret++;
      }
      if (
        digitsBeforeCaret > 0 &&
        (digitsBeforeCaret === 4 || digitsBeforeCaret === 7) &&
        formatted[nextCaret] === "-"
      ) {
        nextCaret++;
      }

      // 同步設定，避免 requestAnimationFrame 與下一次按鍵競爭而把游標帶到尾端
      input.setSelectionRange(nextCaret, nextCaret);
    }
  });

  input.addEventListener("blur", () => {
    const formatted = formatMobile(input.value);
    if (input.value !== formatted) input.value = formatted;
  });
}
const newPhoneInput = document.getElementById("newPhone");
const editPhoneInput = document.getElementById("editEmployeePhone");
bindMobileFormat(newPhoneInput);
bindMobileFormat(editPhoneInput);

// 日期格式

function dateText(value) {
  if (!value) return "";

  const d = new Date(value);

  return Number.isNaN(d.getTime())
    ? ""
    : d.toLocaleString("zh-TW", { hour12: false });
}

// 呼叫 Worker API

async function api(path, body = {}) {
  const response = await fetch(ACCOUNT_API_URL + path, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + accessToken
    },
    body: JSON.stringify(body)
  });

  const result = await response.json().catch(() => ({}));

  if (!response.ok || result.success === false) {
    throw new Error(result.error || "伺服器請求失敗");
  }

  return result;
}

    error.hidden = true;

  createValidationTouched.name = false;
  createValidationTouched.email = false;
  createValidationTouched.phone = false;
  createValidationTouched.password = false;

const createValidationTouched = {
  name: false,
  email: false,
  phone: false,
  password: false
};

function validateCreatePhone(showError = true) {
  const input = document.getElementById("newPhone");
  const error = document.getElementById("newPhoneError");
  const valid = validMobile(input.value);

  if (!showError && !createValidationTouched.phone) return valid;

  input.classList.toggle("field-invalid", !valid);
  input.setAttribute("aria-invalid", String(!valid));
  error.textContent = valid
    ? ""
    : "請輸入有效手機號碼（09XX-XXX-XXX），共 10 碼。";
  error.hidden = valid;
  return valid;
}

function validateCreatePassword(showError = true) {
  const input = document.getElementById("newPassword");
  const error = document.getElementById("newPasswordError");
  const valid = input.value.length >= 8;

  if (!showError && !createValidationTouched.password) return valid;

  input.classList.toggle("field-invalid", !valid);
  input.setAttribute("aria-invalid", String(!valid));
  error.textContent = valid
    ? ""
    : (!input.value
        ? "請輸入初始密碼。"
        : `初始密碼至少需要 8 個字元，目前輸入 ${input.value.length} 個字元。`);
  error.hidden = valid;
  return valid;
}

function validateCreateForm(showAllErrors = false) {
  const fields = {
    name: document.getElementById("newName"),
    email: document.getElementById("newEmail"),
    phone: document.getElementById("newPhone"),
    password: document.getElementById("newPassword")
  };

  const values = {
    name: fields.name.value.trim(),
    email: fields.email.value.trim(),
    phone: fields.phone.value,
    password: fields.password.value
  };

  const checks = {
    name: values.name.length > 0,
    email: /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(values.email),
    phone: validMobile(values.phone),
    password: values.password.length >= 8
  };

  const errors = {
    name: "請輸入員工姓名。",
    email: values.email ? "請輸入有效的 Email 格式。" : "請輸入 Email。",
    phone: "請輸入有效手機號碼（09XX-XXX-XXX），共 10 碼。",
    password: values.password
      ? `初始密碼至少需要 8 個字元，目前輸入 ${values.password.length} 個字元。`
      : "請輸入初始密碼。"
  };

  Object.keys(fields).forEach(key => {
    if (showAllErrors) createValidationTouched[key] = true;
    if (showAllErrors || createValidationTouched[key]) {
      fields[key].classList.toggle("field-invalid", !checks[key]);
      fields[key].setAttribute("aria-invalid", String(!checks[key]));

      // 手機欄位下方的詳細文字依原設計隱藏，避免與共用提示重複。
      const errorEl = document.getElementById(
        key === "name" ? "newNameError" :
        key === "email" ? "newEmailError" :
        key === "phone" ? "newPhoneError" : "newPasswordError"
      );
      if (errorEl) {
        errorEl.textContent = checks[key] ? "" : errors[key];
        errorEl.hidden = checks[key];
      }
    }
  });

  const valid = Object.values(checks).every(Boolean);
  const button = document.getElementById("createBtn");
  if (!employeeCreateInProgress) {
    button.disabled = !valid;
    button.title = valid ? "" : "請先填妥所有必填資料並修正欄位錯誤";
  }
  return valid;
}

const selectedEmployeeIds = new Set();
const employeeSearchEl = document.getElementById("employeeSearch");
const employeeSelectAllEl = document.getElementById("employeeSelectAll");
const employeeHeaderSelectEl = document.getElementById("employeeHeaderSelect");

let employeeSortKey = null;
let employeeSortDirection = "asc";

function sortValue(employee, key) {
  switch (key) {
    case "display_name":
      return String(employee.display_name || "未設定").trim();
    case "email":
      return String(employee.email || "").trim();
    case "phone":
      return String(employee.phone || "").replace(/\\D/g, "");
    case "must_change_password":
      return employee.must_change_password ? 0 : 1;
    case "created_at": {
      const timestamp = Date.parse(employee.created_at || "");
      return Number.isNaN(timestamp) ? -Infinity : timestamp;
    }
    case "status":
      return employee.deleted_at ? 2 : (employee.is_active ? 0 : 1);
    default:
      return "";
  }
}

function sortVisibleEmployees(list) {
  if (!employeeSortKey) return list;
  const direction = employeeSortDirection === "asc" ? 1 : -1;
  return [...list].sort((a, b) => {
    const av = sortValue(a, employeeSortKey);
    const bv = sortValue(b, employeeSortKey);
    let result;
    if (typeof av === "number" && typeof bv === "number") {
      result = av - bv;
    } else {
      result = String(av).localeCompare(String(bv), "zh-TW", {
        numeric: true,
        sensitivity: "base"
      });
    }
    return result * direction;
  });
}

function updateEmployeeSortHeaders() {
  document.querySelectorAll(".employee-sort-button").forEach(button => {
    const active = button.dataset.sortKey === employeeSortKey;
    button.setAttribute(
      "aria-sort",
      active ? (employeeSortDirection === "asc" ? "ascending" : "descending") : "none"
    );
    const arrows = button.querySelector(".sort-arrows");
    if (arrows) arrows.textContent = active
      ? (employeeSortDirection === "asc" ? "↑" : "↓")
      : "↕";
  });
}

document.querySelectorAll(".employee-sort-button").forEach(button => {
  button.addEventListener("click", () => {
    const key = button.dataset.sortKey;
    if (employeeSortKey === key) {
      employeeSortDirection = employeeSortDirection === "asc" ? "desc" : "asc";
    } else {
      employeeSortKey = key;
      employeeSortDirection = "asc";
    }
    updateEmployeeSortHeaders();
    render();
  });
});

function visibleEmployees() {
  const q = (employeeSearchEl?.value || "").trim().toLowerCase();
  return employees.filter(e =>
    [e.display_name, e.email, e.phone, e.landline].some(v => String(v || "").toLowerCase().includes(q))
  );
}

function updateEmployeeBulkControls() {
  const visible = visibleEmployees();
  const selectedVisible = visible.filter(e => selectedEmployeeIds.has(e.id));
  const selected = [...selectedEmployeeIds].map(id => employees.find(e => e.id === id)).filter(Boolean);
  const eligible = selected.filter(e => !e.deleted_at);
  const countEl = document.getElementById("employeeSelectedCount");
  if (countEl) countEl.textContent = `已選取 ${selected.length} 位員工`;
  ["employeeBulkEnable","employeeBulkDisable"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = eligible.length === 0;
  });
  const deleteButton = document.getElementById("employeeBulkDelete");
  if (deleteButton) deleteButton.disabled = selected.length === 0;
  const all = visible.length > 0 && selectedVisible.length === visible.length;
  if (employeeSelectAllEl) employeeSelectAllEl.checked = all;
  if (employeeHeaderSelectEl) employeeHeaderSelectEl.checked = all;
}

function render() {
  const visible = sortVisibleEmployees(visibleEmployees());
  if (!visible.length) {
    rowsEl.innerHTML =
      '<tr><td colspan="8" class="empty">' + (employees.length ? '找不到符合的員工資料' : '目前沒有員工資料') + '</td></tr>';

      : '<button class="employee-action employee-action-edit" data-action="edit" data-id="' + esc(e.id) + '">' + `<svg class="action-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>` + ' 編輯</button>' +
        '<button class="employee-action ' + (active ? 'employee-action-disable' : 'employee-action-enable') + '" data-action="toggle" data-active="' +
        (!active) + '" data-id="' + esc(e.id) + '">' +
        (active ? `<svg class="action-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="m5.6 5.6 12.8 12.8"/></svg>` + ' 停用' : `<svg class="action-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.36 6.64a9 9 0 1 1-12.72 0"/><path d="M12 2v10"/></svg>` + ' 啟用') + '</button>' +
        '<button class="employee-action employee-action-delete" data-action="delete" data-id="' + esc(e.id) + '">' + `<svg class="action-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>` + ' 刪除</button>';

    return '<tr>' +
      '<td class="employee-check-cell"><input class="employee-row-check" type="checkbox" data-select-id="' + esc(e.id) + '" ' + (selectedEmployeeIds.has(e.id) ? 'checked' : '') + ' aria-label="選取員工"></td>' +
      '<td><strong>' + esc(e.display_name || "") + '</strong></td>' +
      '<td>' + esc(e.email || "") + '</td>' +
      '<td>' + esc(e.phone ? formatMobile(e.phone) : "") + '</td>' +

      '<td>' + statusBadge(e) + '</td>' +
      '<td><div class="actions">' + ops + '</div></td>' +
      '</tr>';

  }).join("");
  updateEmployeeBulkControls();
  updateEmployeeSortHeaders();
}

    messageEl.innerHTML = `員工 <span class="employee-delete-name">「${esc(employeeName)}」</span> 目前有 ${Number(quotationCount)} 筆報價建立／修改／刪除紀錄。<br>刪除後將永久移除員工資料及登入帳號，但歷史報價與操作稽核紀錄會完整保留。<br>請輸入完整員工姓名以繼續。`;
    input.value = "";
    confirmBtn.disabled = true;
    overlay.classList.add("show");
    overlay.setAttribute("aria-hidden", "false");
    const cleanup = value => {
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden", "true");
      input.removeEventListener("input", onInput);
      confirmBtn.removeEventListener("click", onConfirm);
      cancelBtn.removeEventListener("click", onCancel);
      document.removeEventListener("keydown", onKey);
      resolve(value);
    };
    const onInput = () => {
      const valid = input.value === employeeName;
      confirmBtn.disabled = !valid;
      hint.textContent = valid ? "姓名確認完成，可以永久刪除。" : "姓名需完全相同，才可繼續。";
    };
    const onConfirm = () => cleanup(employeeName);
    const onCancel = () => cleanup(null);
    const onKey = ev => { if (ev.key === "Escape") onCancel(); if (ev.key === "Enter" && !confirmBtn.disabled) onConfirm(); };
    input.addEventListener("input", onInput);
    confirmBtn.addEventListener("click", onConfirm);
    cancelBtn.addEventListener("click", onCancel);
    document.addEventListener("keydown", onKey);
    setTimeout(() => input.focus(), 60);
  });
}

async function deleteEmployeeWithPreflight(employee) {
  showEmployeeBusy('正在確認員工資料…','正在確認報價及稽核紀錄，請稍候。');
  const preflight = await api("/hard-delete-employee-account", {
    user_id: employee.id,
    preflight: true
  });
  let confirmationName = "";
  if (Number(preflight.quotation_count || 0) > 0) {
    hideEmployeeBusy();
    confirmationName = await confirmEmployeeName(employee, preflight.quotation_count);
    if (confirmationName === null) return null;
    showEmployeeBusy('正在永久刪除員工…','正在移除員工登入帳號，並保留歷史報價及操作紀錄。');
  } else {
    showEmployeeBusy('正在永久刪除員工…','正在移除員工登入帳號，並保留必要的歷史紀錄。');
  }
  return await api("/hard-delete-employee-account", {
    user_id: employee.id,
    confirmation_name: confirmationName
  });
}

rowsEl.addEventListener("click", async ev => {

  const btn = ev.target.closest("button[data-action]");

  if (!btn) return;

  const id = btn.dataset.id;

  const emp = employees.find(x => x.id === id);

  if (!emp) return;

  const action = btn.dataset.action;

  if(employeeActionInProgress)return;
  try {

    if (action === "edit") {
      openEditEmployee(emp);
      return;
    } else if (action === "toggle") {

      const active = btn.dataset.active === "true";

      if (!confirm(
        active
          ? "確定要重新啟用這位員工？"
          : "確定要停用這位員工？"
      )) return;

      employeeActionInProgress=true;setEmployeeActionsDisabled(true);
      showEmployeeBusy(active?'正在啟用員工…':'正在停用員工…','正在更新員工帳號權限，請稍候。');
      await api("/set-employee-status", {
        user_id: id,
        is_active: active
      });
      message(active ? "員工已啟用。" : "員工已停用。");

    } else if (action === "delete") {
      employeeActionInProgress=true;setEmployeeActionsDisabled(true);
      const result = await deleteEmployeeWithPreflight(emp);
      if (!result) return;
      message(`員工「${emp.display_name || ""}」已永久刪除；保留報價 ${result.quotation_count || 0} 筆及操作紀錄。`);
    }

    if(action!=='edit') await loadEmployees();

  } catch (err) {
    message(err.message, true);
  } finally {
    if(employeeActionInProgress){hideEmployeeBusy();employeeActionInProgress=false;setEmployeeActionsDisabled(false);updateEmployeeBulkControls();}
  }
});

// 搜尋與批次選取（全選只作用於目前搜尋結果）
employeeSearchEl.addEventListener("input", render);
function setVisibleEmployeeSelection(checked) {
  visibleEmployees().forEach(e => checked ? selectedEmployeeIds.add(e.id) : selectedEmployeeIds.delete(e.id));
  render();
}
employeeSelectAllEl.addEventListener("change", ev => setVisibleEmployeeSelection(ev.target.checked));
// 表頭不再放置全選勾選框；批次全選保留於上方工具列。
rowsEl.addEventListener("change", ev => {
  const checkbox = ev.target.closest("input[data-select-id]");
  if (!checkbox) return;
  checkbox.checked ? selectedEmployeeIds.add(checkbox.dataset.selectId) : selectedEmployeeIds.delete(checkbox.dataset.selectId);
  updateEmployeeBulkControls();
});

async function bulkSetEmployeeStatus(active) {
  const targets = [...selectedEmployeeIds].map(id => employees.find(e => e.id === id)).filter(e => e && !e.deleted_at);
  if (!targets.length || employeeActionInProgress) return;
  const action = active ? "啟用" : "停用";
  if (!confirm(`確定要${action}選取的 ${targets.length} 位員工嗎？`)) return;
  employeeActionInProgress=true;setEmployeeActionsDisabled(true);
  showEmployeeBusy(`正在批次${action}員工…`,`正在更新 ${targets.length} 位員工的帳號權限，請稍候。`);
  let success = 0, failed = 0;
  try {
    for (const employee of targets) {
      try { await api("/set-employee-status", { user_id: employee.id, is_active: active }); success++; }
      catch (err) { failed++; console.error(`批次${action}員工失敗`, employee.id, err); }
    }
    selectedEmployeeIds.clear();
    await loadEmployees();
    if(failed===0) message(`批次${action}完成：${success} 位員工全部成功。`);
    else message(`批次${action}未完全成功：成功 ${success} 位，失敗 ${failed} 位。請檢查失敗員工後重試。`,true);
  } catch(err) {
    message(`批次${action}處理失敗：${err.message||'未知錯誤'}`,true);
  } finally {
    hideEmployeeBusy();employeeActionInProgress=false;setEmployeeActionsDisabled(false);updateEmployeeBulkControls();
  }
}

async function bulkDeleteEmployees() {
  const targets = [...selectedEmployeeIds].map(id => employees.find(e => e.id === id)).filter(e => !!e);
  if (!targets.length || employeeActionInProgress) return;
  if (!confirm(`即將依序永久刪除選取的 ${targets.length} 位員工。沒有報價紀錄者會直接刪除；有報價紀錄者須逐一輸入姓名確認。歷史報價及操作紀錄均會保留。確定繼續？`)) return;

  employeeActionInProgress=true;setEmployeeActionsDisabled(true);
  let success = 0, failed = 0, cancelled = false;
  try {
    showEmployeeBusy('正在批次刪除員工…',`準備處理 ${targets.length} 位員工，正在確認資料，請稍候。`);
    for (const employee of targets) {
      try {
        const result = await deleteEmployeeWithPreflight(employee);
        if (!result) { cancelled = true; break; }
        success++;
      } catch (err) {
        failed++;
        console.error("永久刪除員工失敗", employee.id, err);
        showEmployeeBusy('正在繼續處理員工…','部分員工處理失敗，系統將繼續處理其餘選取項目。');
      }
    }
    selectedEmployeeIds.clear();
    await loadEmployees();
    if(failed===0 && !cancelled) message(`批次永久刪除完成：${success} 位員工全部成功。歷史報價及操作紀錄均已保留。`);
    else message(`批次永久刪除未完全成功：成功 ${success} 位，失敗 ${failed} 位${cancelled?'，已取消後續項目':''}。歷史報價及操作紀錄保留。`,true);
  } catch(err) {
    message(`批次永久刪除處理失敗：${err.message||'未知錯誤'}`,true);
  } finally {
    hideEmployeeBusy();employeeActionInProgress=false;setEmployeeActionsDisabled(false);updateEmployeeBulkControls();
  }
}

document.getElementById("employeeBulkEnable").addEventListener("click", () => bulkSetEmployeeStatus(true));
document.getElementById("employeeBulkDisable").addEventListener("click", () => bulkSetEmployeeStatus(false));
document.getElementById("employeeBulkDelete").addEventListener("click", bulkDeleteEmployees);

// 重新整理

document.getElementById("refreshBtn")
  .addEventListener("click", loadEmployees);

// 登出

document.getElementById("logoutBtn")
  .addEventListener("click", async () => {

    await sb.auth.signOut();

    location.replace("index.html");

  });

// 啟動

init();

</script>
