<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f2d"><title>全好蔬果｜店家管理</title>
<style>
:root{--g:#173f2d;--g2:#24543d;--ink:#203329;--muted:#718078;--line:#e4e9e4;--bg:#f4f6f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}.top{position:sticky;top:0;z-index:1000;height:84px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,5vw)}.brand{display:flex;align-items:center;gap:14px;color:var(--g);font-weight:800;text-decoration:none;letter-spacing:1px}.brand img{width:62px;height:62px;object-fit:contain;border-radius:12px}.actions{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}.login-name{font-weight:700;color:var(--g);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn{border:1px solid #dce5dc;background:#fff;color:var(--g);border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;text-decoration:none;font:inherit}.btn.primary{background:var(--g);color:#fff;border-color:var(--g)}.wrap{max-width:1120px;margin:0 auto;padding:38px 22px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}.heading h1{font-size:29px;color:var(--g);margin:0 0 7px}.heading p{margin:0;color:var(--muted);font-size:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 7px 22px #19372508}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px}.toolbar input{max-width:360px}.field{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font:inherit;background:#fbfcfa}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #edf0ec;font-size:14px}th{color:#607067;background:#f8faf7;font-weight:700}td .small{color:var(--muted);font-size:12px}.status{display:inline-block;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700}.on{background:#e8f3e9;color:#27613a}.off{background:#f2eeee;color:#8a5550}.rowactions{display:flex;gap:8px}.rowactions button{padding:7px 10px;font-size:12px}.notice{display:none;padding:12px 14px;border-radius:9px;background:#edf4ed;color:#31523c;margin:0 0 16px;white-space:pre-wrap;font-size:13px}.notice.show{display:block}.notice.error{background:#fff1ee;color:#9b392b}.modal{display:none;position:fixed;inset:0;background:#10241888;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.dialog{width:min(100%,560px);background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 70px #0003}.dialog h2{margin:0 0 18px;color:var(--g)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* 建立店家視窗：尺寸、欄位間距與員工建立視窗一致 */
#modal .dialog{padding:25px}
#storeForm .grid{gap:16px}
#storeForm .field{height:43px}
#accountFields>label{display:block;margin:14px 0 7px;font-size:13px;font-weight:700;color:#425448}
#accountFields>label:first-of-type{margin-top:0}
#accountFields>.field-error{margin-bottom:10px}
.store-account-note{font-size:12px;color:#718078;margin:10px 0 0;line-height:1.5}.group label{display:block;font-size:13px;font-weight:700;margin:0 0 7px;color:#425448}.group.full{grid-column:1/-1}.dialogfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:650px){.heading{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.group.full{grid-column:auto}.top{padding:0 14px;gap:8px}.brand span{font-size:12px}.brand img{width:48px;height:48px}.actions{gap:6px;font-size:11px;flex-wrap:wrap;justify-content:flex-end}.login-name{max-width:100px}.btn{padding:8px 9px;font-size:12px}.wrap{padding:25px 14px}}
@media(min-width:601px) and (max-width:650px){#storeForm .grid{grid-template-columns:1fr 1fr}}
@media(max-width:440px){#modal .dialog{padding:20px}}

/* 刪除處理中的全頁遮罩與動態跑條 */
.busy-overlay{display:none;position:fixed;inset:0;z-index:20;background:rgba(13,29,20,.48);align-items:center;justify-content:center;padding:20px}
.busy-overlay.show{display:flex}
.busy-card{width:min(100%,390px);background:#fff;border-radius:16px;padding:26px 24px;box-shadow:0 18px 60px #0003;text-align:center}
.busy-spinner{width:38px;height:38px;margin:0 auto 14px;border:4px solid #e4eee6;border-top-color:var(--g);border-radius:50%;animation:busy-spin .8s linear infinite}
.busy-title{font-weight:800;color:var(--g);font-size:17px;margin-bottom:7px}
.busy-text{font-size:13px;color:var(--muted);margin-bottom:17px}
.busy-track{height:7px;background:#e9efe9;border-radius:99px;overflow:hidden}
.busy-bar{height:100%;width:38%;background:linear-gradient(90deg,#24543d,#70a77f,#24543d);border-radius:99px;animation:busy-run 1.25s ease-in-out infinite}
@keyframes busy-spin{to{transform:rotate(360deg)}}
@keyframes busy-run{0%{transform:translateX(-115%)}100%{transform:translateX(290%)}}
@media(prefers-reduced-motion:reduce){.busy-spinner,.busy-bar{animation:none}.busy-bar{width:100%;transform:none}}

/* 店家刪除確認視窗：可調整字級、置中與版面 */
.confirm-overlay{position:fixed;inset:0;background:rgba(15,25,20,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:1200}
.confirm-overlay.show{display:flex}
.confirm-card{width:min(100%,560px);background:#fff;border-radius:18px;padding:30px 32px;box-shadow:0 22px 70px rgba(0,0,0,.24);text-align:center}
.confirm-icon{width:58px;height:58px;border-radius:50%;background:#fff2e8;color:#b45309;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;margin:0 auto 16px}
.confirm-title{font-size:25px;line-height:1.4;font-weight:850;color:#173f30;margin:0 0 14px}
.confirm-message{font-size:17px;line-height:1.9;color:#394b42;white-space:pre-line;margin:0 0 18px}
.confirm-store-name{display:inline-block;font-weight:850;color:#173f30;font-size:19px}
.confirm-input{width:100%;box-sizing:border-box;border:1.5px solid #cbd5ce;border-radius:10px;padding:14px 15px;font-size:18px;text-align:center;outline:none;margin:4px 0 8px}
.confirm-input:focus{border-color:#1c5940;box-shadow:0 0 0 3px rgba(28,89,64,.12)}
.confirm-hint{font-size:14px;color:#718078;min-height:22px;margin-bottom:18px}
.confirm-actions{display:flex;justify-content:center;gap:12px;margin-top:12px}
.confirm-actions .btn{min-width:116px;padding:12px 18px;font-size:16px}
.confirm-danger{background:#a83232!important;color:#fff!important;border-color:#a83232!important}
.confirm-primary{background:#174b36!important;color:#fff!important;border-color:#174b36!important}
.confirm-actions button:disabled{opacity:.42;cursor:not-allowed}
@media(max-width:520px){.confirm-card{padding:24px 18px}.confirm-title{font-size:22px}.confirm-message{font-size:16px}.confirm-actions{flex-direction:column-reverse}.confirm-actions .btn{width:100%}}

/* 店家清單：欄位標題與內容置中 */
.tablewrap table{width:100%;text-align:center}
.tablewrap th,.tablewrap td{text-align:center!important;vertical-align:middle}
.tablewrap th:first-child{font-size:0}
.tablewrap th:first-child::after{content:"";font-size:0}
.tablewrap td:first-child{width:44px}
.tablewrap .rowactions{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.tablewrap .rowactions .btn{white-space:nowrap}
#bulkEnable span,#bulkDisable span,#bulkDelete span{display:inline-block;font-weight:900;font-size:16px;margin-right:3px}
.confirm-message{white-space:normal;text-align:center}
.confirm-message .confirm-line{display:block;margin:0 0 8px}
.confirm-message .confirm-store-name{color:#c62828;font-weight:900}

.action-icon{display:inline-block;width:16px;height:16px;vertical-align:-3px;flex:0 0 auto}
#bulkEnable .action-icon,[data-toggle] .action-icon{color:var(--g)}
#bulkDisable .action-icon{color:#b45309}
#bulkDelete .action-icon,[data-delete] .action-icon{color:#c62828}
#bulkEnable,#bulkDisable,#bulkDelete{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.tablewrap .rowactions .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px}

/* 勾選框加大並沿用全好蔬果深綠色 */
#selectAll,
.store-select {
  appearance: auto;
  -webkit-appearance: checkbox;
  width: 22px !important;
  height: 22px !important;
  min-width: 22px;
  min-height: 22px;
  accent-color: #174b38;
  cursor: pointer;
  vertical-align: middle;
}
#selectAll { width: 22px !important; height: 22px !important; }
.tablewrap td:first-child { width: 54px; text-align: center !important; }
.tablewrap td:first-child input { display: inline-block; margin: 0; }
.tablewrap .rowactions .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.tablewrap .rowactions [data-edit] .action-icon { color: #174b38; }
.tablewrap .rowactions [data-contacts] .action-icon { color: #527b68; }

/* 搜尋欄靠右，並在搜尋文字前顯示放大鏡 */
.toolbar{justify-content:flex-end;width:100%}
.searchbox{position:relative;display:block;width:min(100%,360px)}
.searchbox .field{width:100%;max-width:none;padding-left:42px}
.searchbox .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#527b68;pointer-events:none;z-index:1}
.searchbox:focus-within .search-icon{color:#174b38}

/* 聯絡人清單 Loading：相對表格可視區域水平、垂直置中 */
.contacts-tablewrap{position:relative;min-height:96px}
.contacts-loading-overlay{display:none;position:absolute;inset:0;z-index:2;align-items:center;justify-content:center;background:rgba(255,255,255,.72);pointer-events:none}
.contacts-loading-overlay.show{display:flex}
.contacts-loading-overlay .contact-loading{width:100%;min-height:96px;justify-content:center}
/* 聯絡人清單讀取動畫 */
.contact-loading{display:flex;align-items:center;justify-content:center;gap:10px;min-height:46px;color:var(--muted);font-weight:600}
.mini-spinner{width:20px;height:20px;border:3px solid #e3ece6;border-top-color:var(--green);border-right-color:var(--green);border-radius:50%;display:inline-block;animation:contactSpin .75s linear infinite}
.loading-dots{display:inline-block;width:1.5em;text-align:left}
.loading-dots::after{content:"";animation:contactDots 1.35s steps(4,end) infinite}
@keyframes contactSpin{to{transform:rotate(360deg)}}
@keyframes contactDots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}

/* 全站一致的返回首頁圖示 */
.home-icon{width:16px;height:16px;display:inline-block;vertical-align:-3px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.site-topbar-home,.home-link{display:inline-flex!important;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
/* 全站資料處理遮罩與動態進度條 */
.global-busy-overlay{display:none;position:fixed;inset:0;z-index:3000;background:rgba(13,29,20,.42);align-items:center;justify-content:center;padding:20px}
.global-busy-overlay.show{display:flex}
.global-busy-card{width:min(100%,390px);background:#fff;border:1px solid #e4e9e4;border-radius:16px;padding:26px 24px;box-shadow:0 18px 60px #0003;text-align:center;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.global-busy-spinner{width:38px;height:38px;margin:0 auto 14px;border:4px solid #e4eee6;border-top-color:#173f2d;border-radius:50%;animation:global-busy-spin .8s linear infinite}
.global-busy-title{font-weight:800;color:#173f2d;font-size:17px;margin-bottom:7px}
.global-busy-text{font-size:13px;color:#718078;margin-bottom:17px}
.global-busy-track{height:7px;background:#e9efe9;border-radius:99px;overflow:hidden}
.global-busy-bar{height:100%;width:38%;background:linear-gradient(90deg,#24543d,#70a77f,#24543d);border-radius:99px;animation:global-busy-run 1.25s ease-in-out infinite}
@keyframes global-busy-spin{to{transform:rotate(360deg)}}
@keyframes global-busy-run{0%{transform:translateX(-115%)}100%{transform:translateX(290%)}}
@media(prefers-reduced-motion:reduce){.global-busy-spinner,.global-busy-bar{animation:none}.global-busy-bar{width:100%;transform:none}}
@media print{.global-busy-overlay{display:none!important}}


.global-busy-title.busy-dots::after{content:'';display:inline-block;width:1.5em;text-align:left;animation:global-busy-dots 1.25s steps(4,end) infinite}
@keyframes global-busy-dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%,100%{content:'...'}}

/* 使用者要求：不顯示全畫面資料載入遮罩 */
.global-busy-overlay, #busyOverlay { display:none !important; visibility:hidden !important; pointer-events:none !important; }

/* 管理頁面共用視覺規範：與員工管理頁一致 */
.top{
  width:100%;padding:0 max(22px,calc((100% - 1120px)/2));
  height:84px;gap:16px;
}
.brand{font-size:14px;letter-spacing:1px}
.wrap{max-width:1120px;padding:36px 22px}
.heading{margin-bottom:22px;gap:15px}
.heading h1{font-size:28px;line-height:1.3}
.panel{border-radius:15px;padding:22px;box-shadow:0 6px 20px #1b392408}
.tablewrap{overflow-x:auto}
table{min-width:850px}
th,td{padding:13px 10px;font-size:13px;vertical-align:middle}
th{background:#fafbf9;color:#65756a}
.rowactions{gap:6px;flex-wrap:wrap}
.rowactions button{padding:7px 9px;font-size:11px;border-radius:9px}
.btn{border:1px solid var(--line);border-radius:9px;padding:10px 15px;font-size:13px;font-weight:700}
.btn.primary{background:var(--g);color:#fff;border-color:var(--g)}
@media(max-width:650px){
  .top{padding:0 14px}
  .wrap{padding:24px 14px}
  .heading{align-items:flex-start;flex-direction:column}
}


/* 店家列操作按鈕：與員工管理一致 */
.tablewrap .rowactions [data-toggle].store-action-enable{color:#27613a;border-color:#d5e3d9;background:#e8f3e9}
.tablewrap .rowactions [data-toggle].store-action-enable .action-icon{color:#27613a}
.tablewrap .rowactions [data-edit]{color:#174b38;border-color:#d5e3d9;background:#fff}
.tablewrap .rowactions [data-edit] .action-icon{color:#174b38}
.tablewrap .rowactions [data-toggle].store-action-disable{color:#c62828;border-color:#efcccc;background:#fff1ef}
.tablewrap .rowactions [data-toggle].store-action-disable .action-icon{color:#c62828}
.tablewrap .rowactions [data-delete]{color:#c62828;border-color:#efcccc;background:#fff1ef}
.tablewrap .rowactions [data-delete] .action-icon{color:#c62828}
.tablewrap .rowactions [data-contacts]{color:#527b68;border-color:#d5e3d9;background:#fff}


/* 頁面切換骨架屏：員工管理／店家管理 */
.page-skeleton{position:fixed;inset:0;z-index:10000;background:#f5f8f5;padding:0 0 40px;overflow:auto;opacity:1;visibility:visible;transition:opacity .22s ease,visibility .22s ease}
.page-skeleton.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
.skeleton-top{height:76px;background:#fff;border-bottom:1px solid #e6ece6;display:flex;align-items:center;padding:0 max(24px,calc((100vw - 1180px)/2));gap:14px}
.skeleton-logo{width:48px;height:48px;border-radius:12px}
.skeleton-line,.skeleton-block,.skeleton-pill{position:relative;overflow:hidden;background:#e6ece7;border-radius:8px}
.skeleton-line:after,.skeleton-block:after,.skeleton-pill:after,.skeleton-logo:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);animation:skeleton-shimmer 1.35s ease-in-out infinite}
.skeleton-brand{width:170px;height:17px}
.skeleton-user{width:110px;height:14px;margin-left:auto}
.skeleton-content{width:min(1180px,calc(100% - 48px));margin:38px auto 0}
.skeleton-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}
.skeleton-title{width:190px;height:30px;margin-bottom:10px}
.skeleton-subtitle{width:260px;height:14px}
.skeleton-actions{display:flex;gap:10px}
.skeleton-pill{width:112px;height:40px;border-radius:9px}
.skeleton-panel{background:#fff;border:1px solid #e4ebe4;border-radius:15px;padding:22px;box-shadow:0 6px 20px #1b392408}
.skeleton-panel-title{width:130px;height:20px;margin-bottom:22px}
.skeleton-toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}
.skeleton-search{width:min(340px,48%);height:40px}
.skeleton-small-pill{width:125px;height:36px}
.skeleton-table-head,.skeleton-table-row{display:grid;grid-template-columns:1.1fr 1.5fr 1.2fr .8fr 1fr;gap:18px;align-items:center;padding:15px 10px;border-bottom:1px solid #edf1ed}
.skeleton-table-head{background:#fafbf9}
.skeleton-table-row{height:58px}
.skeleton-cell{height:13px}
.skeleton-cell.short{width:55%}
.skeleton-cell.medium{width:78%}
.skeleton-table-head .skeleton-cell{height:12px}
@keyframes skeleton-shimmer{100%{transform:translateX(100%)}}
@media(max-width:700px){.skeleton-content{width:calc(100% - 28px);margin-top:24px}.skeleton-top{height:64px;padding:0 14px}.skeleton-heading{align-items:flex-start;flex-direction:column}.skeleton-actions{width:100%}.skeleton-pill{flex:1}.skeleton-panel{padding:14px}.skeleton-table-head,.skeleton-table-row{grid-template-columns:1fr 1fr 1fr;gap:10px}.skeleton-table-head .skeleton-cell:nth-child(n+4),.skeleton-table-row .skeleton-cell:nth-child(n+4){display:none}.skeleton-search{width:65%}}


/* 版型微調：店家列表搜尋欄、批次列與員工管理統一 */
.panel > h2{
  font-size:21px;
  line-height:1.3;
  font-weight:700;
  margin:.83em 0;
}
.toolbar{
  justify-content:flex-end;
  width:100%;
  margin-bottom:14px;
}
.searchbox{width:min(100%,360px)}
.searchbox .field{
  width:100%;
  max-width:none;
  height:44px;
}
/* 搜尋提示文字大小與員工管理搜尋欄一致 */
.searchbox .field{font-size:13px;}
.bulkbar{
  margin-top:0!important;
  margin-bottom:14px!important;
}
.bulkbar > button:disabled{
  opacity:.6;
  cursor:not-allowed;
  background:#fff;
  color:var(--g);
  border-color:#dce5dc;
  box-shadow:none;
}
.bulkbar > button:disabled .action-icon{
  color:currentColor;
}
.bulkbar > #bulkDelete:disabled{
  color:#a33!important;
  border-color:#e7caca!important;
}

/* 連絡電話欄合併顯示手機及市話，兩筆號碼各自一行 */
#rows td.contact-phone-cell { min-width: 150px; white-space: nowrap; line-height: 1.65; }
#rows td.contact-phone-cell .contact-phone-stack { width:max-content; margin:0 auto; display:flex; flex-direction:column; align-items:flex-start; text-align:left; }
#rows td.contact-phone-cell span { display:block; white-space:nowrap; text-align:left; }



/* 店家管理標題列操作按鈕：尺寸、間距、位置與員工管理一致 */
.heading-actions{display:flex!important;align-items:center!important;justify-content:flex-end;gap:10px!important;flex-wrap:nowrap!important;flex-shrink:0}
.heading-actions .icon-action{box-sizing:border-box;width:40px!important;height:40px!important;min-width:40px!important;min-height:40px!important;padding:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 40px;border:1px solid #dce5dc;border-radius:9px;background:#fff;color:#174b38;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .15s}
.heading-actions .icon-action:hover{background:#edf3ed;border-color:#b8cbbd}
.heading-actions .icon-action:focus-visible{outline:3px solid rgba(23,75,56,.18);outline-offset:2px}
.heading-actions .icon-action:active{transform:scale(.96)}
.heading-actions .icon-action:disabled{opacity:.55;cursor:not-allowed}
.heading-actions .heading-icon{width:19px!important;height:19px!important;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.heading-actions>.btn.primary{box-sizing:border-box;min-height:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
@media(max-width:700px){.heading-actions{gap:8px!important;flex-wrap:wrap!important}}


/* 全頁成功／失敗通知：固定在最上層，避免被新增／編輯視窗遮住 */
#notice.notice {
  position: fixed !important;
  top: 14px !important;
  left: 50% !important;
  transform: translateX(-50%);
  z-index: 20000 !important;
  width: min(720px, calc(100vw - 28px));
  max-width: calc(100vw - 28px);
  margin: 0 !important;
  padding: 14px 18px !important;
  border: 1px solid #cfe2d2;
  border-radius: 12px;
  box-shadow: 0 12px 34px rgba(20, 45, 30, .20);
  font-size: 14px;
  line-height: 1.55;
  text-align: center;

<script>
/* 全站統一 Loading：初始載入、頁面切換、資料讀取、儲存與刪除 */
(function(){
  window.__suppressGlobalBusy = true;
  const overlay = document.getElementById('globalBusyOverlay') || document.getElementById('busyOverlay');
  if (!overlay || window.__globalBusyControllerInstalled) return;
  window.__globalBusyControllerInstalled = true;

  const title = overlay.querySelector('.global-busy-title') || overlay.querySelector('#busyTitle');
  const detail = overlay.querySelector('.global-busy-text') || overlay.querySelector('#busyText');
  let active = 0, pendingInitial = 0, pageLoaded = false, showTimer = null, hideTimer = null;
  let currentKind = 'load';

  function setText(kind){
    currentKind = kind;
    if(title){
      title.classList.toggle('busy-dots', kind === 'save' || kind === 'load' || kind === 'delete');
      title.textContent = ({
        load:'資料載入中', save:'儲存中', delete:'刪除中'
      })[kind] || '資料處理中';
    }
    if(detail){
      detail.textContent = ({
        load:'正在讀取資料，請稍候…',
        save:'正在儲存資料，請稍候，請勿重複操作。',
        delete:'正在安全刪除資料，請稍候，請勿重複操作。',
        switch:'正在準備頁面內容，請稍候…'
      })[kind] || '系統正在處理資料，請稍候…';
    }
  }
  function show(kind){
    if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}
    setText(kind);
    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden','false');
  }
  function hide(){
    if(active > 0 || !pageLoaded) return;
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden','true');
  }

  // 不因頁面初始載入或頁面切換顯示全頁遮罩；僅在實際資料請求時顯示。
  window.addEventListener('load', function(){
    pageLoaded = true;
    if(active === 0) setTimeout(hide, 180);
  }, {once:true});
const nativeFetch = window.fetch.bind(window);
  window.fetch = function(input, init){
    const raw = typeof input === 'string' ? input : (input && input.url) || '';
    const tracked = !window.__suppressGlobalBusy &&
      (/supabase\.co|workers\.dev/i.test(raw));
    if(!tracked) return nativeFetch(input, init);

    const method = String((init && init.method) || (input && input.method) || 'GET').toUpperCase();
    const destructive = method === 'DELETE' || /delete|remove|hard-delete/i.test(raw);
    const writing = ['POST','PUT','PATCH'].includes(method);
    const kind = destructive ? 'delete' : writing ? 'save' : 'load';

    active++;
    pendingInitial++;
    if(showTimer) clearTimeout(showTimer);
    if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}
    // 顯示延遲避免極短請求造成閃爍；頁面初始 Loading 已經顯示
    showTimer = setTimeout(()=>show(kind), 100);

    let request;
    try{request = nativeFetch(input, init);}
    catch(error){finish();throw error;}
    return request.finally(finish);
  };

  function finish(){
    active = Math.max(0, active - 1);
    pendingInitial = Math.max(0, pendingInitial - 1);
    if(active === 0){
      if(showTimer){clearTimeout(showTimer);showTimer=null;}
      hideTimer = setTimeout(hide, 220);
    }
  }

  // 提供頁面程式可共用的手動控制介面
  window.showGlobalLoading = function(kind='load'){show(kind);};
  window.hideGlobalLoading = function(){if(active===0){pageLoaded=true;hide();}};
})();

</script>

 if(!input||input.dataset.mobileFormatBound)return;

  const digitsBeforeCaret=original.slice(0,caret).replace(/\D/g,'').length;

   input.value=formatted;
   let nextCaret=0,seenDigits=0;

   }else{
    while(nextCaret<formatted.length&&seenDigits<digitsBeforeCaret){

async function toggleStore(id){

function showStoreStatusConfirm(enabling,storeName,count=1){
 return new Promise(resolve=>{
  const overlay=$('storeDeleteConfirm');
  const title=$('deleteConfirmTitle'),msg=$('deleteConfirmMessage'),input=$('deleteConfirmInput'),hint=$('deleteConfirmHint');
  const ok=$('deleteConfirmOk'),cancel=$('deleteConfirmCancel');
  let settled=false;
  const cleanup=value=>{
   if(settled)return;settled=true;
   overlay.classList.remove('show');overlay.setAttribute('aria-hidden','true');
   ok.onclick=null;cancel.onclick=null;document.removeEventListener('keydown',onKey);
   input.style.display='block';resolve(value);
  };
  const action=enabling?'重新啟用':'停用';
  const onKey=e=>{if(e.key==='Escape')cleanup(false);if(e.key==='Enter')ok.click()};
  title.textContent=`確認${action}店家`;
  msg.innerHTML='';
  const line1=document.createElement('span');line1.className='confirm-line';
  line1.textContent=count>1?`確定要${action}選取的 ${count} 間店家嗎？`:`確定要${action}店家 `;
  if(count===1){
   const name=document.createElement('span');name.className='confirm-store-name';name.textContent=`「${storeName}」`;
   line1.append(name);
   line1.append(' 嗎？');
  }
  const line2=document.createElement('span');line2.className='confirm-line';
  line2.textContent='店家狀態會控制該店所有聯絡人的登入權限。';
  const line3=document.createElement('span');line3.className='confirm-line';
  line3.textContent='個別聯絡人的啟用／停用設定會保留，不會被更動。';
  msg.append(line1,line2,line3);
  input.value='';input.style.display='none';
  hint.textContent='請確認操作對象及影響範圍。';
  ok.textContent=`確認${action}`;ok.disabled=false;
  ok.className=enabling?'btn confirm-primary':'btn confirm-danger';
  cancel.textContent='取消';cancel.className='btn';
  ok.onclick=()=>cleanup(true);cancel.onclick=()=>cleanup(false);
  overlay.classList.add('show');overlay.setAttribute('aria-hidden','false');
  document.addEventListener('keydown',onKey);
 });
}

function showStoreDeleteConfirm(storeName,quotationCount){
 return new Promise(resolve=>{
  const overlay=$('storeDeleteConfirm');
  const title=$('deleteConfirmTitle'),msg=$('deleteConfirmMessage'),input=$('deleteConfirmInput'),hint=$('deleteConfirmHint');
  const ok=$('deleteConfirmOk'),cancel=$('deleteConfirmCancel');
  let stage=1,settled=false;
  const cleanup=value=>{if(settled)return;settled=true;overlay.classList.remove('show');overlay.setAttribute('aria-hidden','true');ok.onclick=null;cancel.onclick=null;input.oninput=null;document.removeEventListener('keydown',onKey);resolve(value)};
  const onKey=e=>{if(e.key==='Escape')cleanup(null);if(e.key==='Enter'&&stage===1&&input.value===storeName)ok.click()};
  title.textContent='確認永久刪除店家';
  msg.innerHTML='';
  const line1=document.createElement('span');line1.className='confirm-line';
  line1.append('店家 ');
  const name1=document.createElement('span');name1.className='confirm-store-name';name1.textContent=`「${storeName}」`;
  line1.append(name1,` 目前有 ${Number(quotationCount)} 張報價單。`);
  const line2=document.createElement('span');line2.className='confirm-line';line2.textContent='刪除後會永久移除店家及登入帳號。';
  const line3=document.createElement('span');line3.className='confirm-line';line3.append('請輸入 ');
  const name2=document.createElement('span');name2.className='confirm-store-name';name2.textContent=`「${storeName}」`;
  line3.append(name2,' 以繼續刪除。');
  msg.append(line1,line2,line3);
  input.value='';input.style.display='block';input.placeholder='請輸入完整店家名稱';hint.textContent='名稱需完全相同，才可繼續。';
  ok.textContent='下一步';ok.disabled=true;ok.className='btn confirm-primary';
  cancel.textContent='取消';cancel.className='btn';
  input.oninput=()=>{ok.disabled=input.value.trim()!==storeName};
  ok.onclick=()=>{
   if(stage===1){
    if(input.value.trim()!==storeName)return;
    stage=2;input.style.display='none';
    title.textContent='最後確認刪除';
    msg.textContent=`確定要永久刪除「${storeName}」嗎？\\n\\n歷史報價單 ${Number(quotationCount)} 張及稽核紀錄會保留。店家及其聯絡人登入帳號將被移除，此操作無法復原。`;
    hint.textContent='請再次確認刪除對象及保留資料。';
    ok.textContent='確認永久刪除';ok.className='btn confirm-danger';ok.disabled=false;
   }else cleanup(storeName);
  };
  cancel.onclick=()=>cleanup(null);
  overlay.classList.add('show');overlay.setAttribute('aria-hidden','false');
  document.addEventListener('keydown',onKey);
  setTimeout(()=>input.focus(),60);
 });
}

async function deleteStore(id){
 if(deleteInProgress)return;
 const s=stores.find(x=>x.id===id);if(!s)return;
 deleteInProgress=true;
 let busyVisible=false;
 try{
   showBusy('正在確認店家資料…','正在確認是否有報價單，請稍候。');busyVisible=true;
   let confirmName='';
   const {data:{session}}=await db.auth.getSession();
   if(!session)throw new Error('登入狀態已失效，請重新登入。');
   // 先由 Worker 安全檢查報價數量；預檢不會刪除資料
   const first=await fetch(API_BASE+'/delete-store',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({store_id:id,preflight:true})});
   let info={};try{info=await first.json()}catch(_){}
   if(first.status===409&&info.requires_name_confirmation){
     hideBusy();busyVisible=false;
     confirmName=await showStoreDeleteConfirm(s.name,info.quotation_count);
     if(confirmName===null)return;
   }else if(!first.ok){
     throw new Error(info.error||'無法確認店家刪除條件');
   }
   // 無報價單時依需求直接刪除，不顯示確認視窗
   showBusy('正在刪除店家…','正在處理店家資料及聯絡人帳號，並保留必要的歷史紀錄。');busyVisible=true;
   const result=await callAdminApi('/delete-store',{store_id:id,confirmation_name:confirmName});
   if(result.auth_delete_failures?.length){
     message('店家已刪除，但部分聯絡人登入帳號刪除失敗，請立即回報管理者。',true);
   }else{
     message(`店家「${s.name}」已刪除；保留報價單 ${result.quotation_count} 張，處理聯絡人 ${result.deleted_contacts} 位。`);
   }
   await load();
 }catch(err){
   message('刪除店家失敗：'+(err.message||'未知錯誤'),true);
 }finally{
   if(busyVisible)hideBusy();
   deleteInProgress=false;
 }
}


async function bulkSetStoreStatus(active){
 const ids=[...selectedStoreIds];if(!ids.length||deleteInProgress)return;
 const action=active?'啟用':'停用';
 const targets=ids.map(id=>stores.find(s=>s.id===id)).filter(Boolean);
 const confirmed=await showStoreStatusConfirm(active,'',targets.length);
 if(!confirmed)return;
 deleteInProgress=true;showBusy(`正在批次${action}店家…`,`正在更新 ${targets.length} 間店家的狀態，請稍候。`);
 try{
  const {error}=await db.from('stores').update({is_active:active,updated_at:new Date().toISOString()}).in('id',ids);
  if(error)throw error;
  selectedStoreIds.clear();message(`已${action} ${targets.length} 間店家；個別聯絡人的啟用設定未更動。`);
  await load();
 }catch(err){message(`批次${action}失敗：${err.message||'未知錯誤'}`,true);await load()}
 finally{hideBusy();deleteInProgress=false;updateBulkControls()}
}
async function bulkDeleteStores(){
 const ids=[...selectedStoreIds];if(!ids.length||deleteInProgress)return;
 const targets=ids.map(id=>stores.find(s=>s.id===id)).filter(Boolean);
 if(!confirm(`即將依序刪除選取的 ${targets.length} 間店家。沒有報價單的店家會直接刪除；有報價單的店家仍須逐一輸入完整名稱確認。確定繼續？`))return;
 let completed=0,failed=0;
 for(const item of targets){
   // deleteStore 自行執行報價預檢及必要的名稱確認；逐筆處理可避免批次誤刪有報價店家
   await deleteStore(item.id);
   if(!stores.some(x=>x.id===item.id)){completed++;selectedStoreIds.delete(item.id)}
   else failed++;
 }
 message(`批次刪除處理完成：成功 ${completed} 間，未刪除／失敗 ${failed} 間。`,failed>0);
 await load();updateBulkControls();
}
